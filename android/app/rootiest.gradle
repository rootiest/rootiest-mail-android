// The Rootiest Mail build: a "rootiest" flavor of upstream's "distribution" dimension, applied from app/build.gradle.
//
//   rootiest  Rootiest Mail (dev.rootiest.mail), installed alongside Bulwark Mobile. Its resources in src/rootiest/
//             replace upstream's by name; the launcher icon and name are generated by scripts/brand.py. It has no
//             in-app updater (Obtainium updates it), so like the play flavor it lacks the installer permission.
//
import java.util.Properties

// Everything Rootiest-specific in the Gradle build lives here, so app/build.gradle differs from upstream by one line.

// Bump for each Rootiest release on the same upstream version; reset to 1 after merging a new upstream release.
// versionName is upstream's plus "-r<revision>" (0.1.96-r1), and versionCode is upstream's times 100 plus the
// revision, so it keeps increasing across upstream releases.
def rootiestRevision = 5

// Google push goes through our Firebase project (rootiest-mail), registered for dev.rootiest.mail; its
// google-services.json is in src/rootiest/. relay.rootiest.dev sends with that project's service account. A
// build without the file (a fork) skips the Google services task, and BuildConfig.FCM_AVAILABLE
// tells the app to offer UnifiedPush only.
def rootiestFirebase = file('src/rootiest/google-services.json').isFile()

// Release signing: the key's properties file (storeFile, storePassword, keyAlias, keyPassword), named by the Gradle
// property rootiest.mail.signing in ~/.gradle/gradle.properties on the machine that releases (README, "Releases").
// Upstream's BULWARK_RELEASE_* key is not used. Without the property a rootiest release build stops, as upstream's
// does without its key: a release signed with the public debug key could be replaced by anyone.
def rootiestKeyPath = providers.gradleProperty('rootiest.mail.signing').orNull
def rootiestKey = null
if (rootiestKeyPath != null) {
    rootiestKey = new Properties()
    file(rootiestKeyPath).withInputStream { rootiestKey.load(it) }
}

android {
    signingConfigs {
        if (rootiestKey != null) {
            rootiestRelease {
                storeFile file(rootiestKey.getProperty('storeFile'))
                storePassword rootiestKey.getProperty('storePassword')
                keyAlias rootiestKey.getProperty('keyAlias')
                keyPassword rootiestKey.getProperty('keyPassword')
            }
        }
    }
    defaultConfig {
        buildConfigField 'boolean', 'FCM_AVAILABLE', 'true'
    }
    productFlavors {
        rootiest {
            dimension 'distribution'
            applicationId 'dev.rootiest.mail'
            versionCode android.defaultConfig.versionCode * 100 + rootiestRevision
            versionName "${android.defaultConfig.versionName}-r${rootiestRevision}"
            buildConfigField 'String', 'DISTRIBUTION', '"rootiest"'
            buildConfigField 'boolean', 'FCM_AVAILABLE', rootiestFirebase.toString()
            // Upstream's release build type sets a key only with BULWARK_RELEASE_*, so this one applies to rootiest
            // release builds; debug builds keep the debug key.
            if (rootiestKey != null) {
                signingConfig signingConfigs.rootiestRelease
            }
        }
    }
}

if (!rootiestFirebase) {
    tasks.configureEach { task ->
        if (task.name ==~ /processRootiest\w*GoogleServices/) {
            task.enabled = false
        }
    }
}

// A rootiest release needs the Rootiest key, not upstream's: swap upstream's check (checkReleaseSigning, which asks for
// BULWARK_RELEASE_*) for one that asks for rootiest.mail.signing.
def checkRootiestReleaseSigning = tasks.register('checkRootiestReleaseSigning') {
    group = 'verification'
    description = 'Fails a Rootiest Mail release build that has no Rootiest release key.'
    doLast {
        if (rootiestKey == null) {
            throw new GradleException('Rootiest Mail release signing is not configured: set rootiest.mail.signing in ' +
                    '~/.gradle/gradle.properties to the key\'s properties file (README, "Releases").')
        }
        def store = file(rootiestKey.getProperty('storeFile'))
        if (!store.isFile()) {
            throw new GradleException("rootiest.mail.signing names the keystore ${store}, which does not exist.")
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'preRootiestReleaseBuild') {
        task.setDependsOn(task.dependsOn.findAll { !(it instanceof TaskProvider && it.name == 'checkReleaseSigning') })
        task.dependsOn(checkRootiestReleaseSigning)
    }
}
